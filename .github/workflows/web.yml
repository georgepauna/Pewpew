# Builds the browser version of Pewpew with pygbag (Python+pygame -> WASM)
# and publishes it to GitHub Pages on every push to master.
#
# This is the auto-sync pipeline: because the web build compiles the SAME
# pewpew.py, every release that lands on master reships the web version with
# zero hand-porting. No separate JS codebase to keep in step.
#
# ONE-TIME manual step before the first deploy succeeds:
#   Repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Payload note: the full repo is ~950 MB (music_cache, tuning, .git, replays,
# screenshots). The game only needs pewpew.py + art/ (~31 MB), so we stage a
# clean dir and build from that instead of packing the whole tree.

name: web

on:
  push:
    branches: [master]
    paths:
      - 'pewpew.py'
      - 'art/**'
      - '_menu_layer_tuning.json'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; cancel an in-flight one if a newer
# push arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pygbag
        run: python -m pip install --upgrade pygbag pyoxipng

      - name: Stage minimal web build
        run: |
          set -eux
          rm -rf web_build
          mkdir -p web_build
          # pygbag's entry point convention is main.py; asset paths in
          # pewpew.py all resolve via Path(__file__).parent, so renaming the
          # entry file is harmless as long as art/ sits beside it.
          cp pewpew.py web_build/main.py
          cp -r art web_build/art
          if [ -f _menu_layer_tuning.json ]; then
            cp _menu_layer_tuning.json web_build/
          fi
          # The .bmp twins exist only for the device (no SDL_image there);
          # pygbag's pygame-ce loads PNG fine, and the loader prefers .bmp
          # when present. Drop them: ~6.5 MB lighter + forces the PNG path.
          find web_build/art -name '*.bmp' -delete
          # The root-level art/*.png sheets (~21 MB) are EDITOR SOURCE only
          # (_sprite_editor.py / _slice_art.py). The runtime loads its sprites
          # from art/sprites/ via _find_sprite() and never references the big
          # sheets — verified no "art/<sheet>.png" refs in pewpew.py. Drop
          # them from the bundle: a lossless ~75% cut, pixel-perfect untouched.
          # Keep art/sprites/ and the art/*.json the game actually reads.
          find web_build/art -maxdepth 1 -name '*.png' -delete
          echo "Staged web build:" && du -sh web_build web_build/art web_build/art/sprites

      - name: Losslessly optimize art PNGs (web bundle only)
        run: |
          python - <<'PY'
          # pygbag's SDL_image has no WebP/JPEG decoder (verified: WebP-content
          # PNGs fail to load -> procedural fallbacks), so the bundle has to
          # stay PNG. oxipng re-deflates each PNG losslessly (identical pixels)
          # and strips metadata — the only safe shrink that needs no code or
          # manifest-coord changes. Web bundle only; repo PNGs untouched.
          import pathlib, oxipng
          root = pathlib.Path("web_build/art")
          before = after = 0
          n = 0
          for p in root.rglob("*.png"):
              before += p.stat().st_size
              try:
                  oxipng.optimize(str(p), level=6, strip=oxipng.StripChunks.safe())
              except Exception as e:
                  print(f"skip {p}: {e}")
              after += p.stat().st_size; n += 1
          mb = 1048576
          print(f"oxipng {n} PNGs: {before/mb:.1f} MB -> {after/mb:.1f} MB "
                f"({100*(1-after/before):.0f}% smaller)")
          PY
          echo "After optimize:" && du -sh web_build/art

      - name: Build with pygbag
        working-directory: web_build
        run: python -m pygbag --build --title Pewpew main.py

      - name: Make the canvas fill the viewport (kill the gray bands)
        run: |
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("web_build/build/web/index.html")
          html = p.read_text(encoding="utf-8")
          css = (
            "<style>\n"
            "  html,body{margin:0!important;padding:0!important;"
            "background:#000!important;overflow:hidden!important;"
            "width:100%;height:100%;}\n"
            "  canvas#canvas{position:fixed!important;left:0!important;"
            "top:0!important;width:100vw!important;height:100vh!important;"
            "background:#000!important;}\n"
            "</style>\n"
          )
          # Inject right before </head> so it overrides pygbag's template CSS.
          if "</head>" in html and "canvas#canvas{position:fixed" not in html:
              html = html.replace("</head>", css + "</head>", 1)
              p.write_text(html, encoding="utf-8")
              print("injected fill CSS")
          else:
              print("CSS not injected (no </head> or already present)")
          PY

      - name: Suppress browser RMB context-menu + MMB autoscroll
        run: |
          python - <<'PY'
          # Desktop-web uses the mouse for gameplay: RMB = Ball / "safe back",
          # MMB = rewind / "destructive back". Without this the browser hijacks
          # them (right-click context menu, middle-click autoscroll). We only
          # preventDefault the BROWSER default — SDL still delivers the events
          # to the game, so the in-game RMB/MMB bindings keep working.
          import pathlib
          p = pathlib.Path("web_build/build/web/index.html")
          html = p.read_text(encoding="utf-8")
          js = (
            "<script>\n"
            "  window.addEventListener('contextmenu', e => e.preventDefault(),"
            " {capture:true});\n"
            "  window.addEventListener('auxclick', e => { if(e.button===1)"
            " e.preventDefault(); }, {capture:true});\n"
            "  window.addEventListener('mousedown', e => { if(e.button===1)"
            " e.preventDefault(); }, {capture:true});\n"
            "</script>\n"
          )
          if "</head>" in html and "addEventListener('contextmenu'" not in html:
              html = html.replace("</head>", js + "</head>", 1)
              p.write_text(html, encoding="utf-8")
              print("injected mouse-default guard")
          else:
              print("guard not injected (no </head> or already present)")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_build/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
